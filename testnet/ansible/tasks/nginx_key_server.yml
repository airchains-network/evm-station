- name: Install nginx
  package:
    name:
      - nginx

- name: Change keys permissions to allow serving from nginx
  file:
    path: /home/ubuntu
    state: directory
    mode: '0755'

- name: Share keys in internal frontend
  register: nginx_conf
  copy:
    dest: /etc/nginx/sites-available/default
    content: |
      server {
        listen 10.0.1.100:80 default_server;

        root /home/ubuntu/fhevm-keys;

        server_name _;

        location / {
          # First attempt to serve request as file, then
          # as directory, then fall back to displaying a 404.
          try_files $uri $uri/ =404;
        }
      }

- name: reload_nginx
  when: nginx_conf.changed
  service:
    name: nginx
    state: reloaded

- name: Copy FHEVM keys
  copy:
    src: "{{ playbook_dir }}/../localnet/fhevm-keys"
    dest: /home/ubuntu/

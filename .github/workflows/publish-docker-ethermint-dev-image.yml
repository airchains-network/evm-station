name: Publish developer image

on:
  workflow_dispatch:
    inputs:
      ethermint_node_tag:
        description: 'Ethermint node tag (default: latest)'
        default: "latest"
        type: string
        required: false
      dev_image_tag:
        description: 'Dev image (to be built/pushed) tag (default: latest)'
        default: "latest"
        type: string
        required: false
      ref_to_ethermint:
        description: 'Branch, tag or commit SHA1 to checkout Ethermint'
        required: true
        default: "main"
        type: string

env:
  DOCKER_IMAGE: ghcr.io/zama-ai/ethermint-dev-node


jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    steps:
      # space wasn't enough at some point
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be

      - name: Check out ethermint
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref_to_ethermint }}
      
      - name: Set DESCRIPTION_IMAGE
        run: |
         echo "DESCRIPTION_IMAGE=ethermint-node-docker=${{ inputs.ethermint_node_tag }}">> $GITHUB_ENV

      - name: Echo docker versions and package description
        run: |
          echo "DESCRIPTION_IMAGE: $DESCRIPTION_IMAGE"

      - name: Check OS
        run: |
          lscpu
          uname -r
          lsb_release -a

      - name: Login to GitHub Container Registry
        uses: docker/login-action@49ed152c8eca782a232dede0303416e8f356c37b
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: List files in ethermint
        run: |
          ls docker
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          annotations: |
            org.opencontainers.image.description=${{ env.DESCRIPTION_IMAGE }}
          labels: |
            zama.fhevm.dev.version=${{ inputs.ethermint_node_tag }}
            zama.fhevm.dev.description="fhEVM dev image"
          images: ${{ env.DOCKER_IMAGE }}:${{ inputs.dev_image_tag }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        

      - name: Echo labels
        run: |
            echo "${{ steps.meta.outputs.labels }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          build-args: |
            ETHERMINT_NODE_VERSION=${{ inputs.ethermint_node_tag }}
          context: .
          file: docker/Dockerfile.ethermint-node.developer
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKER_IMAGE }}:${{ inputs.dev_image_tag }},${{ env.DOCKER_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          

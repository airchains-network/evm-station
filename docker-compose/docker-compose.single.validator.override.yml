version: '3'

services:
  validator:
    # To avoid panic this env variable is added at run and not init (calling setup.sh)
    environment:
      - FHEVM_GO_KEYS_DIR=/root/.ethermintd/zama/keys/network-fhe-keys
      # used for kms-sync
      - KMS_ENDPOINT_ADDR=kms:50051
      - FHEVM_OTEL_COLLECTOR_ENDPOINT=otel_collector:4317
    entrypoint: /usr/bin/ethermintd  start --home /root/.ethermintd --pruning=nothing --log_level info  --minimum-gas-prices=0.0001aphoton  --json-rpc.gas-cap=50000000  --json-rpc.api eth,txpool,net,web3 --rpc.laddr tcp://0.0.0.0:26657

  oracle:
    environment:
      - AGGREGATOR_ADDR=aggregator:5005
      - ETHEREUM_ADDR=ws://validator:8546
      - ETHERMINT_ADDR=tcp://validator:26657
      # This privateKey correspond to addr 0x97F272ccfef4026A1F3f0e0E879d514627B84E69 which needs
      # to be added as relayer in the oracle contract
      - PRIVATE_KEY_ORACLE_RELAYER=7ec931411ad75a7c201469a385d6f18a325d4923f9f213bd882bbea87e160b67
      - ORACLE_CONTRAT_PREDEPLOY_ADDRESS=0xc8c9303Cd7F337fab769686B593B87DC3403E0ce

  aggregator:
    environment:
      - LIGHTNODE_ADDR=http://validator:26657
      - KMS_NODE_ADDR=http://kms-async:50052